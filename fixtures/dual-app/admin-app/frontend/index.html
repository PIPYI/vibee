<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Listings</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
      .listing { padding: 10px; border: 1px solid #ccc; margin-bottom: 10px; border-radius: 4px; }
      .status { padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
      .status.pending { background: #ffd700; color: #333; }
      .status.approved { background: #90ee90; color: #333; }
      .status.rejected { background: #ffcccb; color: #333; }
      button { margin-left: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Listings (Admin Review)</h1>
    <div id="listings-container"></div>
    <script src="/app.js"></script>
  </body>
</html>
